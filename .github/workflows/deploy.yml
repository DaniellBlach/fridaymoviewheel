name: Deploy Vue App to GitHub Pages

on:
  push:
    branches:
      - release # Akcja uruchomi się tylko po pushu na branch release

# Nadanie uprawnień do zapisu na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zapewnia, że w danym momencie odbywa się tylko jedno wdrożenie
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Zamień na 'yarn' lub 'pnpm' jeśli używasz innego menedżera

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Folder wyjściowy budowania Vite (zazwyczaj 'dist')

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4